services:
  dind:
    build:
      context: ../..
      dockerfile: docker/jenkins/Dockerfile.dind
    container_name: idle-game-dind
    privileged: true
    command: ["dockerd", "--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock"]
    volumes:
      - jenkins_home:/var/jenkins_home
      - jenkins_dind:/var/lib/docker
      - jenkins_agent_home:/home/jenkins/agent
    mem_limit: ${DIND_MEMORY_LIMIT:-1536m}
    mem_reservation: ${DIND_MEMORY_RESERVATION:-1024m}
    restart: unless-stopped

  jenkins:
    build:
      context: ../..
      dockerfile: docker/jenkins/Dockerfile
    container_name: idle-game-jenkins
    ports:
      - "8081:8081"
      - "50000:50000"
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin123}
      JENKINS_AGENT_NAME: ${JENKINS_AGENT_NAME:-idle-game-build-agent}
      JENKINS_AGENT_LABEL: ${JENKINS_AGENT_LABEL:-idle-game-build-agent linux docker}
      JENKINS_AGENT_REMOTE_FS: ${JENKINS_AGENT_REMOTE_FS:-/home/jenkins/agent}
      JENKINS_AGENT_EXECUTORS: ${JENKINS_AGENT_EXECUTORS:-1}
      JAVA_OPTS: "${JENKINS_JAVA_OPTS:--Djenkins.install.runSetupWizard=false -Xms128m -Xmx256m -XX:+UseG1GC}"
      JENKINS_OPTS: "--httpPort=8081"
      DOCKER_HOST: tcp://dind:2375
    volumes:
      - jenkins_home:/var/jenkins_home
      - ../../:/workspace/idle-game
    mem_limit: ${JENKINS_MEMORY_LIMIT:-416m}
    mem_reservation: ${JENKINS_MEMORY_RESERVATION:-288m}
    depends_on:
      - dind
    restart: unless-stopped

  agent:
    build:
      context: ../..
      dockerfile: docker/jenkins/Dockerfile.agent
    container_name: idle-game-jenkins-agent
    environment:
      JENKINS_URL: http://jenkins:8081
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin123}
      JENKINS_AGENT_NAME: ${JENKINS_AGENT_NAME:-idle-game-build-agent}
      JENKINS_AGENT_WORKDIR: ${JENKINS_AGENT_REMOTE_FS:-/home/jenkins/agent}
      DOCKER_HOST: tcp://dind:2375
    volumes:
      - jenkins_agent_home:${JENKINS_AGENT_REMOTE_FS:-/home/jenkins/agent}
      - ../../:/workspace/idle-game
    mem_limit: ${JENKINS_AGENT_MEMORY_LIMIT:-1536m}
    mem_reservation: ${JENKINS_AGENT_MEMORY_RESERVATION:-1024m}
    depends_on:
      - jenkins
      - dind
    restart: unless-stopped

volumes:
  jenkins_home:
  jenkins_dind:
  jenkins_agent_home:
