services:
  dind:
    build:
      context: .
      dockerfile: docker/jenkins/Dockerfile.dind
    container_name: idle-game-dind
    privileged: true
    command: ["dockerd", "--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock"]
    volumes:
      - jenkins_dind:/var/lib/docker
    restart: unless-stopped

  jenkins:
    build:
      context: .
      dockerfile: docker/jenkins/Dockerfile
    container_name: idle-game-jenkins
    ports:
      - "8081:8081"
      - "50000:50000"
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin123}
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      JENKINS_OPTS: "--httpPort=8081"
      DOCKER_HOST: tcp://dind:2375
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./:/workspace/idle-game
    depends_on:
      - dind
    restart: unless-stopped

volumes:
  jenkins_home:
  jenkins_dind:
